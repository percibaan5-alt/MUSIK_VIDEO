<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Koleksi Saya wkwkwk ini cuman testing - YukiChii</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .blob {
            position: fixed;
            filter: blur(90px);
            opacity: 0.4;
            z-index: 0;
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen relative overflow-x-hidden transition-colors duration-300 flex flex-col justify-between">

    <!-- Glowing Background Ambient -->
    <div class="blob bg-indigo-600 w-96 h-96 top-0 -left-20"></div>
    <div class="blob bg-purple-600 w-96 h-96 bottom-0 -right-20"></div>

    <div class="relative z-10 w-full flex flex-col min-h-screen">
        
        <!-- Header -->
        <header class="sticky top-0 z-40 glass-panel border-b border-slate-200/50 dark:border-slate-800">
            <div class="max-w-4xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gradient-to-tr from-indigo-500 to-pink-500 rounded-xl flex items-center justify-center text-white shadow-lg shadow-indigo-500/20">
                        <i class="fa-solid fa-play text-sm ml-0.5"></i>
                    </div>
                    <div>
                        <span class="text-base font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 block">
                            Video Koleksi Saya
                        </span>
                        <span class="text-[10px] text-slate-400 font-medium block">
                            Created by YukiChii
                        </span>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <button id="themeToggle" onclick="toggleTheme()" class="p-2.5 rounded-xl glass-panel hover:bg-slate-200/50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 transition-all">
                        <i id="themeIcon" class="fa-solid fa-moon text-sm"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Section -->
        <main class="flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 py-8 flex flex-col justify-center">
            <div class="space-y-4">
                
                <!-- Frame Pemutar Video MP4 Lokal -->
                <div class="relative w-full aspect-video rounded-3xl overflow-hidden bg-slate-900 shadow-2xl border border-slate-800 flex items-center justify-center">
                    <video id="localVideoPlayer" controls class="w-full h-full object-contain">
                        <source id="videoSource" src="video-koleksi.mp4" type="video/mp4">
                        Browser Anda tidak mendukung pemutar video HTML5.
                    </video>
                </div>

                <!-- Detail Informasi Video -->
                <div class="glass-panel p-6 rounded-3xl border border-slate-200/60 dark:border-slate-800 space-y-4">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                            <span id="currentCategory" class="px-3 py-1 rounded-full text-xs font-bold bg-indigo-500/10 text-indigo-500 border border-indigo-500/20">
                                Koleksi MP4
                            </span>
                            <h1 id="currentTitle" class="text-xl font-extrabold text-slate-800 dark:text-white mt-2">
                                Video Spesial YukiChii
                            </h1>
                            <p id="currentAuthorDate" class="text-xs text-slate-400 mt-1">
                                Pemilik • YukiChii
                            </p>
                        </div>

                        <!-- Tombol Suka & Bagikan -->
                        <div class="flex items-center gap-2">
                            <button id="likeBtn" onclick="toggleLike()" class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-semibold text-xs border border-slate-200 dark:border-slate-700">
                                <i id="likeIcon" class="fa-regular fa-heart text-sm"></i>
                                <span id="likeCount">150</span>
                            </button>
                            <button onclick="shareVideo()" class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-semibold text-xs border border-slate-200 dark:border-slate-700">
                                <i class="fa-solid fa-share-nodes text-sm"></i>
                                <span>Bagikan</span>
                            </button>
                        </div>
                    </div>

                    <!-- Deskripsi Video -->
                    <div class="pt-4 border-t border-slate-200/50 dark:border-slate-800/80">
                        <h3 class="text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Deskripsi</h3>
                        <p id="currentDescription" class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">
                            Pemutar video MP4 lokal yang disimpan langsung di dalam folder web YukiChii.
                        </p>
                    </div>
                </div>

            </div>
        </main>

        <!-- Footer -->
        <footer class="py-4 text-center text-xs text-slate-400 border-t border-slate-200/50 dark:border-slate-800/50">
            Video Koleksi Saya &copy; 2026 • Developed by <span class="font-bold text-indigo-500">YukiChii</span>
        </footer>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300">
        <div class="glass-panel bg-slate-900 text-white dark:bg-white dark:text-slate-900 px-4 py-3 rounded-2xl shadow-xl text-xs font-bold flex items-center gap-2 border border-slate-700">
            <i class="fa-solid fa-circle-check text-emerald-400"></i>
            <span id="toastMsg">Notifikasi</span>
        </div>
    </div>

    <!-- Script Logika -->
    <script>
        // ==========================================
        // CARA MENGGANTI VIDEO MP4 (KHUSUS YUKICHII):
        // 1. Letakkan file video MP4 Anda di satu folder yang sama dengan file index.html ini.
        // 2. Ubah nama file di bawah ini sesuai dengan nama file MP4 Anda.
        // ==========================================
        let videoFileConfig = {
            fileName: "𝙏𝙄𝙂𝙄 𝙏𝙄𝙂𝙄 𝘿𝘼 𝙏𝙍𝙀𝙉𝘿 𝙓 𝙃𝘼𝙄𝙈𝙄𝙔𝘼 𝙀𝘿𝙄𝙏.mp4", // <-- Ganti nama file MP4 di sini (Contoh: "yukichii-video.mp4")
            title: "𝙏𝙄𝙂𝙄 𝙏𝙄𝙂𝙄 𝘿𝘼 𝙏𝙍𝙀𝙉𝘿 𝙓 𝙃𝘼𝙄𝙈𝙄𝙔𝘼 𝙀𝘿𝙄𝙏",
            category: "Koleksi Pribadi gabut klo ada vidio lagi nanti UP lagi",
            description: "Diputar langsung di web YukiChii."
        };

        let isLiked = false;
        let likesCount = 150;

        document.addEventListener('DOMContentLoaded', () => {
            const source = document.getElementById('videoSource');
            source.src = videoFileConfig.fileName;
            document.getElementById('localVideoPlayer').load();
            
            document.getElementById('currentTitle').innerText = videoFileConfig.title;
            document.getElementById('currentCategory').innerText = videoFileConfig.category;
            document.getElementById('currentDescription').innerText = videoFileConfig.description;
        });

        function toggleLike() {
            isLiked = !isLiked;
            likesCount += isLiked ? 1 : -1;
            
            document.getElementById('likeCount').innerText = likesCount;
            const btn = document.getElementById('likeBtn');
            const icon = document.getElementById('likeIcon');

            if(isLiked) {
                btn.className = "flex items-center gap-2 px-4 py-2.5 rounded-xl bg-rose-500/10 text-rose-500 font-semibold text-xs border border-rose-500/30";
                icon.className = "fa-solid fa-heart text-sm text-rose-500";
                showToast("Menyukai video ini!");
            } else {
                btn.className = "flex items-center gap-2 px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-semibold text-xs border border-slate-200 dark:border-slate-700";
                icon.className = "fa-regular fa-heart text-sm";
                showToast("Batal menyukai.");
            }
        }

        function shareVideo() {
            navigator.clipboard.writeText(window.location.href);
            showToast("Tautan web berhasil disalin!");
        }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 2500);
        }
    </script>
</body>
</html>

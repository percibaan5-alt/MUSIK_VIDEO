<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YukiChii Official Gallery</title>
    <!-- Font Google Inter & Poppins untuk tipografi super rapi -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: #050a18;
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.25) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.15) 0px, transparent 50%);
            color: #f8fafc;
            padding: 20px 15px;
            min-height: 100vh;
        }
        .container {
            max-width: 1050px;
            margin: 0 auto;
        }

        /* ==========================================
           1. OPENING SCREEN (SUPER RAPI & ELEGAN)
           ========================================== */
        #openingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 7, 18, 0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s ease;
        }
        
        .opening-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            max-width: 380px;
            padding: 20px;
            animation: openingAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Logo Circle Neon */
        .opening-logo-ring {
            position: relative;
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.15), rgba(37, 99, 235, 0.25));
            border: 2px solid rgba(56, 189, 248, 0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 22px;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.35);
            animation: ringPulse 2.4s infinite ease-in-out;
        }

        .opening-logo-icon {
            font-size: 34px;
            line-height: 1;
            filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.8));
        }

        /* Text Title & Subtitle */
        .opening-brand-title {
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff 0%, #7dd3fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.4));
        }

        .opening-brand-badge {
            display: inline-block;
            background: rgba(14, 165, 233, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        /* Progress Bar Modern */
        .opening-progress-track {
            width: 160px;
            height: 4px;
            background: rgba(30, 58, 138, 0.35);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
        }

        .opening-progress-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #0284c7 0%, #38bdf8 50%, #60a5fa 100%);
            border-radius: 10px;
            box-shadow: 0 0 12px #38bdf8;
            animation: fillProgress 2.2s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }

        /* Keyframes Animations */
        @keyframes openingAppear {
            0% { transform: translateY(12px) scale(0.94); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        @keyframes ringPulse {
            0%, 100% { box-shadow: 0 0 25px rgba(56, 189, 248, 0.3); transform: scale(1); }
            50% { box-shadow: 0 0 40px rgba(56, 189, 248, 0.6); transform: scale(1.04); }
        }

        @keyframes fillProgress {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(0); }
        }

        .fade-out {
            opacity: 0 !important;
            visibility: hidden !important;
        }

        /* ==========================================
           2. HEADER & MAIN PAGE
           ========================================== */
        header {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 22px 26px;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 22px;
            border: 1px solid rgba(56, 189, 248, 0.25);
            box-shadow: 0 10px 30px -10px rgba(14, 165, 233, 0.2);
        }
        @media(min-width: 768px) {
            header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }
        .header-title h1 {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-title p.subtitle {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
        }
        .owner-badge {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.15), rgba(37, 99, 235, 0.15));
            border: 1px solid #38bdf8;
            color: #38bdf8;
            padding: 7px 16px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            width: fit-content;
        }

        /* Control Bar */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 22px;
        }
        @media(min-width: 768px) {
            .controls {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }
        .search-box {
            position: relative;
            flex: 1;
            max-width: 100%;
        }
        @media(min-width: 768px) {
            .search-box { max-width: 360px; }
        }
        .search-box input {
            width: 100%;
            padding: 11px 15px 11px 40px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #1e3a8a;
            color: #ffffff;
            border-radius: 11px;
            font-size: 13px;
            outline: none;
            transition: all 0.25s ease;
        }
        .search-box input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
        }
        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #38bdf8;
            font-size: 13px;
        }

        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
        }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #1e3a8a;
            color: #94a3b8;
            padding: 8px 15px;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .cat-btn:hover {
            border-color: #38bdf8;
            color: #ffffff;
        }
        .cat-btn.active {
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            color: #ffffff;
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(14, 165, 233, 0.4);
        }

        /* Video Grid */
        .video-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px;
        }
        @media(min-width: 580px) {
            .video-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media(min-width: 950px) {
            .video-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .video-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(30, 58, 138, 0.8);
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }
        .video-card:hover {
            transform: translateY(-4px);
            border-color: #38bdf8;
            box-shadow: 0 10px 22px -5px rgba(56, 189, 248, 0.25);
        }
        .thumb-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
            cursor: pointer;
            overflow: hidden;
        }
        .thumb-container img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.35s ease;
        }
        .video-card:hover .thumb-container img {
            transform: scale(1.05);
        }
        .play-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(5, 10, 24, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .play-icon {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            box-shadow: 0 0 14px rgba(56, 189, 248, 0.5);
        }
        
        .card-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .badge-wrapper {
            margin-bottom: 8px;
            height: 20px;
            display: flex;
            align-items: center;
        }
        .badge {
            background: rgba(30, 58, 138, 0.5);
            color: #38bdf8;
            padding: 3px 9px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            border: 1px solid #1d4ed8;
        }
        .card-title {
            font-size: 13.5px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
            cursor: pointer;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            min-height: 38px; 
            max-height: 38px;
        }
        .card-title:hover { color: #38bdf8; }
        .card-desc {
            font-size: 11.5px;
            color: #94a3b8;
            line-height: 1.45;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            min-height: 34px;
            max-height: 34px;
            margin-bottom: 12px;
        }
        .card-footer {
            border-top: 1px solid rgba(30, 41, 59, 0.8);
            padding-top: 10px;
            font-size: 10.5px;
            color: #64748b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        /* Modal Player */
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(5, 10, 24, 0.92);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 12px;
            display: none;
        }
        .modal-content {
            background: #0f172a;
            border: 1px solid #38bdf8;
            width: 100%;
            max-width: 800px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
        }
        .modal-header {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(90deg, #1e3a8a 0%, #0f172a 100%);
            border-bottom: 1px solid #1e293b;
        }
        .modal-title {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 15px;
        }
        .close-btn {
            background: #0284c7;
            border: none;
            color: white;
            width: 30px; height: 30px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .player-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
        }
        .player-wrapper iframe, .player-wrapper video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }
        .modal-footer {
            padding: 12px 16px;
            font-size: 12px;
            color: #cbd5e1;
            background: #090d1a;
            line-height: 1.4;
        }

        footer {
            text-align: center;
            margin-top: 35px;
            padding: 16px;
            font-size: 11.5px;
            color: #64748b;
            border-top: 1px solid rgba(30, 41, 59, 0.8);
        }
        footer span { color: #38bdf8; font-weight: 600; }
    </style>
</head>
<body>

    <!-- OPENING SCREEN FUTURISTIK & RAPI -->
    <div id="openingScreen">
        <div class="opening-wrapper">
            <div class="opening-logo-ring">
                <span class="opening-logo-icon">🎵</span>
            </div>
            <div class="opening-brand-title">YUKI CHII</div>
            <div class="opening-brand-badge">Official Gallery</div>
            <div class="opening-progress-track">
                <div class="opening-progress-fill"></div>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="header-title">
                <h1>🎬 Galeri Video Resmi YukiChii</h1>
                <p class="subtitle">Koleksi video pilihan milik YukiChii — Cepat, ringan, dan lancar.</p>
            </div>
            <div class="owner-badge">⭐ Official Curator</div>
        </header>

        <!-- Control Bar -->
        <div class="controls">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" oninput="renderVideos()" placeholder="Cari judul video atau lagu...">
            </div>
            <div class="categories">
                <button class="cat-btn active" onclick="filterCat('All', this)">Semua</button>
                <button class="cat-btn" onclick="filterCat('English Songs', this)">English 🇬🇧</button>
                <button class="cat-btn" onclick="filterCat('Russian Songs', this)">Russian 🇷🇺</button>
                <button class="cat-btn" onclick="filterCat('Anime Songs', this)">Anime 🇯🇵</button>
                <button class="cat-btn" onclick="filterCat('Lainnya', this)">Lainnya 🎥</button>
            </div>
        </div>

        <!-- Video Grid -->
        <div id="videoGrid" class="video-grid"></div>

        <!-- Footer -->
        <footer>
            &copy; 2026 Koleksi Resmi • Dibuat & Dikurasi Eksklusif oleh <span>YukiChii</span>
        </footer>
    </div>

    <!-- Modal Pemutar Video -->
    <div id="playerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div id="playerModalTitle" class="modal-title">Judul Video</div>
                <button class="close-btn" onclick="closePlayerModal()">✕</button>
            </div>
            <div class="player-wrapper" id="playerContainer"></div>
            <div class="modal-footer" id="playerModalDesc">Keterangan video</div>
        </div>
    </div>

    <script>
        const videoList = [
            {
                id: 1,
                title: "𝙈𝙀 𝙌𝙐𝙀𝘿𝙊 (𝙏𝙞𝙠𝙏𝙤𝙠 𝙑𝙚𝙧𝙨𝙞𝙤𝙣) | 𝙏𝙄𝙂𝙄 𝙏𝙄𝙂𝙄 𝘿𝘼 𝙏𝙍𝙀𝙉𝘿 𝙓 𝙈𝘼𝙆𝙄𝙈𝘼 𝙀𝘿𝙄𝙏",
                url: "https://youtu.be/TGxhiD-vlqk",
                category: "English Songs",
                description: "Musik santai pilihan terbaik dengan editan visual yang keren.",
                date: "2026-10-29"
            },
            {
                id: 2,
                title: "Руки вверх - А он тебя целует / speed song /",
                url: "https://youtu.be/ZfZ6PUZwXUM",
                category: "Russian Songs",
                description: "Koleksi musik Rusia populer versi speed up ritme energik.",
                date: "2026-10-29"
            },
            {
                id: 3,
                title: "заны препараты (Tiktok slowed version) Roxyedit",
                url: "https://youtu.be/p1tJAyYxi8Y",
                category: "Anime Songs",
                description: "Kumpulan OST dan musik bertema anime edisi slowed vibe.",
                date: "2026-10-29"
            }
        ];

        let currentCategory = 'All';

        window.onload = function() {
            renderVideos();
            
            // TIMING OPENING SCREEN 2.2 DETIK
            setTimeout(function() {
                const opening = document.getElementById('openingScreen');
                if (opening) {
                    opening.classList.add('fade-out');
                }
            }, 2200);
        };

        function parseVideoUrl(url) {
            let videoId = '';
            if (url.includes('youtube.com/watch?v=')) {
                videoId = url.split('v=')[1];
                const amp = videoId.indexOf('&');
                if (amp !== -1) videoId = videoId.substring(0, amp);
            } else if (url.includes('youtu.be/')) {
                videoId = url.split('youtu.be/')[1];
                const q = videoId.indexOf('?');
                if (q !== -1) videoId = videoId.substring(0, q);
            }

            if (videoId && videoId.length >= 10) {
                return {
                    type: 'youtube',
                    embedUrl: 'https://www.youtube.com/embed/' + videoId + '?autoplay=1',
                    thumbUrl: 'https://img.youtube.com/vi/' + videoId + '/mqdefault.jpg'
                };
            }
            return {
                type: 'mp4',
                embedUrl: url,
                thumbUrl: 'https://placehold.co/600x400/0f172a/38bdf8?text=YukiChii+Video'
            };
        }

        function renderVideos() {
            const grid = document.getElementById('videoGrid');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();

            const filtered = videoList.filter(v => {
                const matchCat = currentCategory === 'All' || v.category === currentCategory;
                const matchSearch = v.title.toLowerCase().includes(searchVal) || v.description.toLowerCase().includes(searchVal);
                return matchCat && matchSearch;
            });

            grid.innerHTML = '';

            if (filtered.length === 0) {
                grid.innerHTML = '<div style="text-align:center; grid-column:1/-1; padding:30px; color:#64748b; font-size:13px;">Tidak ada video yang ditemukan.</div>';
                return;
            }

            filtered.forEach(video => {
                const parsed = parseVideoUrl(video.url);
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <div class="thumb-container" onclick="openPlayerModal(${video.id})">
                        <img src="${parsed.thumbUrl}" alt="${video.title}" loading="lazy">
                        <div class="play-overlay">
                            <div class="play-icon">▶</div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="badge-wrapper">
                            <span class="badge">${video.category}</span>
                        </div>
                        <div class="card-title" onclick="openPlayerModal(${video.id})">${video.title}</div>
                        <div class="card-desc">${video.description}</div>
                        <div class="card-footer">
                            <span>📅 ${video.date}</span>
                            <span style="color: #38bdf8; font-weight: 600;">Putar ➔</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCat(cat, btnElement) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            renderVideos();
        }

        function openPlayerModal(id) {
            const video = videoList.find(v => v.id === id);
            if (!video) return;

            const modal = document.getElementById('playerModal');
            const container = document.getElementById('playerContainer');
            document.getElementById('playerModalTitle').innerText = video.title;
            document.getElementById('playerModalDesc').innerText = video.description;

            const parsed = parseVideoUrl(video.url);

            if (parsed.type === 'youtube') {
                container.innerHTML = `<iframe src="${parsed.embedUrl}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
            } else {
                container.innerHTML = `<video src="${parsed.embedUrl}" controls autoplay></video>`;
            }

            modal.style.display = 'flex';
        }

        function closePlayerModal() {
            const modal = document.getElementById('playerModal');
            document.getElementById('playerContainer').innerHTML = ''; 
            modal.style.display = 'none';
        }
    </script>
</body>
</html>

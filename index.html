<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koleksi Video Saya - YukiChii</title>
    <style>
        /* Desain bersih, modern, dan ringan */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        header {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
            border: 1px solid #334155;
        }
        @media(min-width: 768px) {
            header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }
        h1 {
            font-size: 22px;
            color: #fff;
            margin-bottom: 5px;
        }
        p.subtitle {
            font-size: 13px;
            color: #94a3b8;
        }
        .btn {
            background-color: #e11d48;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #be123c;
        }
        .btn-secondary {
            background-color: #334155;
        }
        .btn-secondary:hover {
            background-color: #475569;
        }
        
        /* Filter & Search Bar */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }
        @media(min-width: 768px) {
            .controls {
                flex-direction: row;
                justify-content: space-between;
            }
        }
        input[type="text"], select, textarea {
            width: 100%;
            padding: 10px 14px;
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        input[type="text"]:focus, select:focus, textarea:focus {
            border-color: #e11d48;
        }
        .search-box {
            flex: 1;
            max-width: 400px;
        }
        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .cat-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #cbd5e1;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }
        .cat-btn.active {
            background: #e11d48;
            color: white;
            border-color: #e11d48;
        }

        /* Video Grid */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .video-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }
        .video-card:hover {
            transform: translateY(-3px);
            border-color: #475569;
        }
        .thumb-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* Rasio 16:9 */
            background: #000;
            cursor: pointer;
        }
        .thumb-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .play-icon {
            width: 48px;
            height: 48px;
            background: #e11d48;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(225, 29, 72, 0.4);
        }
        .card-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .card-title {
            font-size: 15px;
            font-weight: bold;
            color: white;
            margin-bottom: 8px;
            cursor: pointer;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .card-title:hover {
            color: #fb7185;
        }
        .card-desc {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 15px;
            flex-grow: 1;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #334155;
            padding-top: 10px;
            font-size: 11px;
            color: #64748b;
        }
        .badge {
            background: #334155;
            color: #f1f5f9;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: bold;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 13px;
        }
        .delete-btn:hover {
            color: #e11d48;
        }

        /* Modal Overlay */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 15px;
            display: none;
        }
        .modal-content {
            background: #1e293b;
            border: 1px solid #334155;
            width: 100%;
            max-width: 800px;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .modal-header {
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }
        .modal-title {
            font-size: 16px;
            font-weight: bold;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 10px;
        }
        .close-btn {
            background: #334155;
            border: none;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .close-btn:hover {
            background: #475569;
        }
        .player-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
        }
        .player-wrapper iframe, .player-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .modal-footer {
            padding: 12px 18px;
            font-size: 12px;
            color: #94a3b8;
            background: #0f172a;
        }

        /* Form Modal */
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #cbd5e1;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #64748b;
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <div>
                <h1>Koleksi Video Saya</h1>
                <p class="subtitle">Dibuat khusus oleh YukiChii — Tonton video YouTube atau MP4 langsung di web.</p>
            </div>
            <button class="btn" onclick="openAddModal()">+ Tambah Video Baru</button>
        </header>

        <!-- Search & Filter Controls -->
        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" oninput="renderVideos()" placeholder="Cari judul video...">
            </div>
            <div class="categories">
                <button class="cat-btn active" onclick="filterCat('All', this)">Semua</button>
                <button class="cat-btn" onclick="filterCat('Tutorial', this)">Tutorial</button>
                <button class="cat-btn" onclick="filterCat('Musik', this)">Musik</button>
                <button class="cat-btn" onclick="filterCat('Gaming', this)">Gaming</button>
                <button class="cat-btn" onclick="filterCat('Lainnya', this)">Lainnya</button>
            </div>
        </div>

        <!-- Video Grid Container -->
        <div id="videoGrid" class="video-grid">
            <!-- Render via JavaScript -->
        </div>
    </div>

    <!-- Modal Pemutar Video Langsung -->
    <div id="playerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div id="playerModalTitle" class="modal-title">Judul Video</div>
                <button class="close-btn" onclick="closePlayerModal()">×</button>
            </div>
            <div class="player-wrapper" id="playerContainer">
                <!-- Iframe/Video tag dimasukkan lewat JS -->
            </div>
            <div class="modal-footer" id="playerModalDesc">
                Deskripsi video
            </div>
        </div>
    </div>

    <!-- Modal Form Tambah Video -->
    <div id="addModal" class="modal">
        <div class="modal-content" style="max-width: 500px;">
            <div class="modal-header">
                <div class="modal-title">Tambah Koleksi Video</div>
                <button class="close-btn" onclick="closeAddModal()">×</button>
            </div>
            <form id="videoForm" onsubmit="saveVideo(event)" style="padding: 20px;">
                <div class="form-group">
                    <label>Judul Video</label>
                    <input type="text" id="vTitle" required placeholder="Contoh: Musik Favorit YukiChii">
                </div>
                <div class="form-group">
                    <label>Link Video (URL YouTube atau file .mp4)</label>
                    <input type="text" id="vUrl" required placeholder="Contoh: https://www.youtube.com/watch?v=xxxx atau link .mp4">
                    <small style="color: #64748b; font-size: 11px; margin-top: 4px; display: block;">Mendukung format youtube.com/watch?v=, youtu.be/, atau file .mp4 langsung.</small>
                </div>
                <div class="form-group">
                    <label>Kategori</label>
                    <select id="vCategory">
                        <option value="Tutorial">Tutorial</option>
                        <option value="Musik">Musik</option>
                        <option value="Gaming">Gaming</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Deskripsi Singkat</label>
                    <textarea id="vDesc" rows="3" placeholder="Tuliskan catatan atau ringkasan isi video..."></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeAddModal()">Batal</button>
                    <button type="submit" class="btn">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Aplikasi -->
    <script>
        // Data Awal Bawaan Koleksi YukiChii
        const defaultVideos = [
            {
                id: 1,
                title: "Lofi Hip Hop Radio - Beats to Relax/Study to",
                url: "https://www.youtube.com/watch?v=jfKfPfyJRdk",
                category: "Musik",
                description: "Kumpulan musik Lofi pilihan untuk menemani hari.",
                date: "2026-03-30"
            }
        ];

        let videos = JSON.parse(localStorage.getItem('yukichii_saved_videos')) || defaultVideos;
        let currentCategory = 'All';

        window.onload = function() {
            renderVideos();
        };

        function saveToStorage() {
            localStorage.setItem('yukichii_saved_videos', JSON.stringify(videos));
        }

        // Fungsi Parser URL YouTube atau MP4 secara handal
        function parseVideoUrl(url) {
            let videoId = '';
            
            if (url.includes('youtube.com/watch?v=')) {
                videoId = url.split('v=')[1];
                if (videoId) {
                    const ampersandPosition = videoId.indexOf('&');
                    if (ampersandPosition !== -1) {
                        videoId = videoId.substring(0, ampersandPosition);
                    }
                }
            } else if (url.includes('youtu.be/')) {
                videoId = url.split('youtu.be/')[1];
                if (videoId) {
                    const queryPosition = videoId.indexOf('?');
                    if (queryPosition !== -1) {
                        videoId = videoId.substring(0, queryPosition);
                    }
                }
            } else if (url.includes('youtube.com/embed/')) {
                videoId = url.split('embed/')[1];
                if (videoId) {
                    const queryPosition = videoId.indexOf('?');
                    if (queryPosition !== -1) {
                        videoId = videoId.substring(0, queryPosition);
                    }
                }
            }

            if (videoId && videoId.length >= 10) {
                return {
                    type: 'youtube',
                    embedUrl: 'https://www.youtube.com/embed/' + videoId + '?autoplay=1',
                    thumbUrl: 'https://img.youtube.com/vi/' + videoId + '/hqdefault.jpg'
                };
            }

            return {
                type: 'mp4',
                embedUrl: url,
                thumbUrl: 'https://placehold.co/600x400/1e293b/ffffff?text=Video+Player'
            };
        }

        // Render daftar video ke halaman utama
        function renderVideos() {
            const grid = document.getElementById('videoGrid');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();

            const filtered = videos.filter(v => {
                const matchCat = currentCategory === 'All' || v.category === currentCategory;
                const matchSearch = v.title.toLowerCase().includes(searchVal) || v.description.toLowerCase().includes(searchVal);
                return matchCat && matchSearch;
            });

            grid.innerHTML = '';

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="empty-state"><h3>Belum ada video koleksi</h3><p>Silakan tambahkan video melalui tombol di atas.</p></div>';
                return;
            }

            filtered.forEach(video => {
                const parsed = parseVideoUrl(video.url);
                
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <div class="thumb-container" onclick="openPlayerModal(${video.id})">
                        <img src="${parsed.thumbUrl}" alt="${video.title}" onerror="this.src='https://placehold.co/600x400/1e293b/ffffff?text=Video'">
                        <div class="play-overlay">
                            <div class="play-icon">▶</div>
                        </div>
                    </div>
                    <div class="card-body">
                        <span class="badge" style="width: fit-content; margin-bottom: 8px;">${video.category}</span>
                        <div class="card-title" onclick="openPlayerModal(${video.id})">${video.title}</div>
                        <div class="card-desc">${video.description || 'Tidak ada deskripsi.'}</div>
                        <div class="card-footer">
                            <span>${video.date}</span>
                            <button class="delete-btn" onclick="deleteVideo(${video.id})" title="Hapus Video">Hapus</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Filter Kategori
        function filterCat(cat, btnElement) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            renderVideos();
        }

        // Modal Form Buka/Tutup
        function openAddModal() {
            document.getElementById('addModal').style.display = 'flex';
        }
        function closeAddModal() {
            document.getElementById('addModal').style.display = 'none';
            document.getElementById('videoForm').reset();
        }

        // Simpan Video Baru
        function saveVideo(e) {
            e.preventDefault();
            const title = document.getElementById('vTitle').value;
            const url = document.getElementById('vUrl').value;
            const category = document.getElementById('vCategory').value;
            const description = document.getElementById('vDesc').value;

            const newVid = {
                id: Date.now(),
                title,
                url,
                category,
                description,
                date: new Date().toISOString().split('T')[0]
            };

            videos.unshift(newVid);
            saveToStorage();
            closeAddModal();
            renderVideos();
        }

        // Hapus Video
        function deleteVideo(id) {
            if (confirm('Yakin ingin menghapus video ini dari koleksi YukiChii?')) {
                videos = videos.filter(v => v.id !== id);
                saveToStorage();
                renderVideos();
            }
        }

        // Buka Pemutar Video Langsung di Modal
        function openPlayerModal(id) {
            const video = videos.find(v => v.id === id);
            if (!video) return;

            const modal = document.getElementById('playerModal');
            const container = document.getElementById('playerContainer');
            document.getElementById('playerModalTitle').innerText = video.title;
            document.getElementById('playerModalDesc').innerText = video.description || 'Tidak ada deskripsi.';

            const parsed = parseVideoUrl(video.url);

            if (parsed.type === 'youtube') {
                container.innerHTML = `<iframe src="${parsed.embedUrl}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
            } else {
                container.innerHTML = `<video src="${parsed.embedUrl}" controls autoplay></video>`;
            }

            modal.style.display = 'flex';
        }

        // Tutup Pemutar Video
        function closePlayerModal() {
            const modal = document.getElementById('playerModal');
            const container = document.getElementById('playerContainer');
            container.innerHTML = ''; 
            modal.style.display = 'none';
        }
    </script>
</body>
</html>
